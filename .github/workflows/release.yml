name: Release por tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Compilar pacote e publicar release
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validar versão da tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+(\.\d+)?(-[0-9A-Za-z.-]+)?$') {
            throw "Tag inválida: '$tag'. Use v1.2 ou v1.2.3 (opcionalmente com sufixo -rc.1)."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Restaurar dependências
        run: dotnet restore ResetExplode.csproj

      - name: Compilar para Windows x64 (.NET 10 autocontido)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish ResetExplode.csproj `
            --configuration Release `
            --framework net10.0-windows7.0 `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:Version=$env:APP_VERSION `
            --output dist `
            --nologo

          if ($LASTEXITCODE -ne 0) { throw "dotnet publish falhou com código $LASTEXITCODE." }
          if (-not (Test-Path 'dist/ResetExplode.exe')) { throw 'O executável dist/ResetExplode.exe não foi gerado.' }

      - name: Gerar pacote ZIP e checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          Copy-Item 'LEIA-ME.txt' 'dist/LEIA-ME.txt'
          $zip = "ResetExplode-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path 'dist/ResetExplode.exe', 'dist/LEIA-ME.txt' -DestinationPath $zip -Force

          $checksumFiles = @('dist/ResetExplode.exe', $zip)
          foreach ($file in $checksumFiles) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash
            "$hash  $(Split-Path $file -Leaf)" | Add-Content 'SHA256SUMS.txt' -Encoding ascii
          }
          "PACKAGE_NAME=$zip" >> $env:GITHUB_ENV

      - name: Criar GitHub Release e enviar arquivos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" "$env:PACKAGE_NAME" 'dist/ResetExplode.exe' 'SHA256SUMS.txt' `
            --target "$env:RELEASE_SHA" `
            --title "RESET EXPLODE $env:RELEASE_TAG" `
            --notes-file NOVIDADES.md `
            --verify-tag

      - name: Resumo da publicação
        if: success()
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          '## Release publicada' >> $env:GITHUB_STEP_SUMMARY
          "- **Versão:** $env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
          "- **Pacote:** ResetExplode-$env:RELEASE_TAG-win-x64.zip" >> $env:GITHUB_STEP_SUMMARY
          '- **Arquivos:** ZIP, executável e checksums SHA-256' >> $env:GITHUB_STEP_SUMMARY
          "- **Release:** https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
