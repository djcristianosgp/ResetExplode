name: Publicar

# Atualiza a release latest a cada push na main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar (arquivo único, com o .NET 10 embutido)
        shell: pwsh
        run: |
          dotnet publish ResetExplode.csproj -c Release -f net10.0-windows7.0 -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish falhou com código $LASTEXITCODE." }
          if (-not (Test-Path 'dist/ResetExplode.exe')) { throw 'O executável dist/ResetExplode.exe não foi gerado.' }

      - name: Montar pacote
        shell: pwsh
        run: |
          Copy-Item 'LEIA-ME.txt' 'dist/LEIA-ME.txt'
          Compress-Archive -Path 'dist/ResetExplode.exe', 'dist/LEIA-ME.txt' -DestinationPath ResetExplode.zip -Force

      - name: Atualizar release latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw 'Não foi possível remover a release latest anterior.' }
          }
          gh release create latest ResetExplode.zip dist/ResetExplode.exe --target $env:GITHUB_SHA --latest --title 'RESET EXPLODE (versão mais recente)' --notes-file NOVIDADES.md
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível criar a release latest.' }
